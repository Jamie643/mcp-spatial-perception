[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-spatial-perception"
version = "0.1.2"
description = "An MCP server exposing real-time spatial perception queries from DePIN edge-vision nodes to LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "jamie643", email = "jamesliberty330@gmail.com" }
]
keywords = ["mcp", "llm", "depin", "spatial", "vision", "agents", "json-rpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mcp-spatial-perception = "mcp_spatial:main"

[project.urls]
Homepage = "https://github.com/jamie643/mcp-spatial-perception"
Repository = "https://github.com/jamie643/mcp-spatial-perception"
Issues = "https://github.com/jamie643/mcp-spatial-perception/issues"

[tool.hatch.build.targets.wheel]
only-include = ["mcp_spatial.py"]

[tool.hatch.build.targets.sdist]
only-include = ["mcp_spatial.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=mcp_spatial --cov-report=term-missing"
